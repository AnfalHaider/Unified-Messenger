     changes shape under it. The app installs its reader when the page loads; this page keeps replacing it with one
     that throws. Nothing here is real. -->

<body>
<div>Inbox</div>
<script>
  setInterval(function () {
    window.__umReadInstagramThreads = function () { throw new Error('the inbox has a shape the reader does not know'); };
  }, 100);
</script>
</body></html>
