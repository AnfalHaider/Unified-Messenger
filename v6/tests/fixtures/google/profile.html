<!doctype html>
<!-- An invented stand-in for Google's merchant view: the bracketed layout ("4.6 ★ (991)"), with a nearby business
     carrying its own "Rated 4.9 out of 5" label, which must not be taken for this profile's rating. -->
<html><head><meta charset="utf-8"><title>Sample Business North</title></head>
<body>
  <h1>Sample Business North</h1>
  <div>Open now (closes 9 PM)</div>
  <div>4.6 ★ (991) · Business</div>
  <div aria-label="Rated 4.9 out of 5,">Sample Business Elsewhere</div>
</body></html>
