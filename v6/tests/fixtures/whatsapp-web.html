<!doctype html>
<!-- A stand-in for WhatsApp Web's chat list, with invented chats. It keeps what was measured on the real page: a
     row ignores a plain click() and opens only on a pointer sequence, only some chats are drawn, and the rest are
     reachable through the store's open-chat command. Nothing here is real customer data. -->
<meta charset="utf-8">
<title>Fixture chats</title>
<div id="app">
  <div id="side">
    <input aria-label="Search or start a new chat" type="text">
    <div id="pane-side" role="grid"></div>
  </div>
  <div id="main-slot"></div>
</div>
<script>
  const CHATS = [
    { title: 'Sample Customer Alpha' },
    { title: 'Sample Customer Al' },
    { title: 'Sample Customer Beta' },
    // Not drawn: reachable only through the store command below.
    { title: 'Sample Customer Hidden', hidden: true },
    { title: '+92 300 1112233', hidden: true },
  ];
  window.__opened = [];
  const pane = document.getElementById('pane-side');

  function render(list) {
    pane.innerHTML = '';
    for (const chat of list) {
      const row = document.createElement('div');
      row.setAttribute('role', 'row');
      row.innerHTML = '<div data-testid="cell-frame-title"><span></span></div>';
      const span = row.querySelector('span');
      span.setAttribute('title', chat.title);
      span.textContent = chat.title;
      // Like the real list: a plain click() does nothing, the pointer sequence opens the chat.
      span.addEventListener('pointerdown', () => open(chat.title));
      pane.appendChild(row);
    }
  }
  function open(title) {
    window.__opened.push(title);
    document.getElementById('main-slot').innerHTML = '<div id="main"><header><span></span></header></div>';
    const h = document.querySelector('#main header span');
    h.setAttribute('title', title);
    h.textContent = title;
  }
  // WhatsApp's own store and open-chat command, for chats that are not drawn. The real command opens the chat a
  // moment later, so this one does too.
  const STORE = { 'hidden@c.us': 'Sample Customer Hidden', '923001112233@c.us': '+92 300 1112233' };
  window.require = (name) => {
    if (name === 'WAWebChatCollection') return { ChatCollection: { get: (key) => (STORE[key] ? { id: key, title: STORE[key] } : undefined) } };
    if (name === 'WAWebCmd') return { Cmd: { openChatBottom: ({ chat }) => setTimeout(() => open(chat.title), 300) } };
    throw new Error(`Requiring unknown module "${name}"`);
  };
  render(CHATS.filter((c) => !c.hidden));
</script>
